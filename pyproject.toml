[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-quant-lab"
version = "0.1.0"
description = "Research-first cryptocurrency signal evaluation framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "threadpoolctl>=3.5",
]

[project.optional-dependencies]
market-data = ["ccxt>=4.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

name: Public market population research

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and public data connector
        run: python -m pip install -e ".[market-data]"
      - name: Fetch public candles and train 5,000 AI agents
        run: python scripts/run_population.py
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: btc-usd-ai-population-report
          path: artifacts/btc_usd_ai_population_report.json
          if-no-files-found: error
          retention-days: 30

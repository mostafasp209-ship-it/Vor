name: Legacy quantitative population benchmark (manual only)

on:
  # This job evaluates numeric model configurations, not knowledge-specialist agents.
  # Keep it manual to avoid consuming free Actions minutes on every code push or daily schedule.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-population-benchmark
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and public data connector
        run: python -m pip install -e ".[market-data]"
      - name: Fetch public candles and evaluate numeric model population
        run: python scripts/run_population.py
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: btc-usd-quantitative-population-report
          path: artifacts/btc_usd_ai_population_report.json
          if-no-files-found: error
          retention-days: 30

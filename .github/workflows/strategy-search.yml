name: Manual futures strategy discovery

'on':
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated Binance USD-M perpetual symbols"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT"
      intervals:
        description: "Comma-separated candle intervals"
        required: true
        default: "15m,1h"
      days:
        description: "Historical days"
        required: true
        default: "365"
      candidates:
        description: "Number of candidates per market"
        required: true
        default: "300"

permissions:
  contents: read

concurrency:
  group: vor-strategy-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e .
      - name: Search futures strategies
        run: >
          python scripts/run_strategy_search.py
          --symbols "${{ inputs.symbols }}"
          --intervals "${{ inputs.intervals }}"
          --days "${{ inputs.days }}"
          --candidates "${{ inputs.candidates }}"
          --shortlist 25
          --min-trades 30
      - name: Upload strategy discovery reports
        uses: actions/upload-artifact@v4
        with:
          name: vor-futures-strategy-search
          path: artifacts/strategy_search/
          if-no-files-found: error
          retention-days: 30